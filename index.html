<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEAN360 Production Transformation Diagnostic</title><style>body{font-family:Segoe UI,Tahoma,Arial,sans-serif;margin:0;background:#f4f7fb;color:#17324d;display:grid;place-items:center;min-height:100vh}.box{background:#fff;border:1px solid #dbe5ef;border-radius:16px;padding:28px 32px;box-shadow:0 8px 24px rgba(0,0,0,.08);max-width:620px;text-align:center}.spin{width:42px;height:42px;border:4px solid #e4ebf2;border-top-color:#ff8618;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}h1{margin:0 0 8px;font-size:24px}.muted{color:#6d8195;font-size:14px;line-height:1.6}</style></head><body><div class="box" id="status"><div class="spin"></div><h1>LEAN360</h1><div class="muted">กำลังโหลด Production Transformation Diagnostic...</div></div><script>(async()=>{const status=document.getElementById('status');try{const files=['payload/p1.txt','payload/p2.txt','payload/p3.txt','payload/p4.txt','payload/p5.txt','payload/p6.txt'];const parts=await Promise.all(files.map(async f=>{const r=await fetch(f+'?v=2',{cache:'no-store'});if(!r.ok)throw new Error('โหลด '+f+' ไม่สำเร็จ ('+r.status+')');return (await r.text()).trim()}));const b64=parts.join('');const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));let html;if('DecompressionStream' in window){const ds=new DecompressionStream('gzip');html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text()}else{await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});html=new TextDecoder().decode(pako.ungzip(bytes))}document.open();document.write(html);document.close()}catch(e){console.error(e);status.innerHTML='<h1 style="color:#b91c1c">เปิดระบบไม่สำเร็จ</h1><div class="muted">'+String(e.message||e)+'</div><p class="muted">กรุณากด Ctrl+F5 เพื่อโหลดใหม่ หากยังไม่สำเร็จให้แจ้งผู้พัฒนา</p>'}})();</script></body></html>
